# Configurazione per Render (https://render.com): Dashboard → New → Blueprint → scegli questo repository.
# Piano GRATUITO: il disco del server si azzera a ogni riavvio, quindi il sito usa Google Drive
# come cloud principale (appunti nel Drive, database salvato e ripristinato dal Drive).
services:
  - type: web
    name: appunti-del-senato
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: OWNER_EMAIL
        value: bryansalguero26@icloud.com
      - key: OWNER_NAME
        value: Bryan
      - key: MAX_UPLOAD_MB
        value: "100"
      # Valori segreti: si inseriscono a mano nella dashboard di Render (mai nel repository)
      - key: OWNER_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DRIVE_REFRESH_TOKEN
        sync: false
      # Assistente AI gratuito: chiave Gemini da https://aistudio.google.com (lasciala vuota per tenere l'AI spenta)
      - key: GEMINI_API_KEY
        sync: false
